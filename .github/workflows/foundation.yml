name: Foundation

on:
  push:
    branches:
      - ayo
  pull_request:

permissions:
  contents: read

jobs:
  buildkit-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEVPUSH_ENV: development
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Compose environment
        run: |
          mkdir -p data
          printf '%s\n' \
            'APP_HOSTNAME=localhost' \
            'DEPLOY_DOMAIN=localhost' \
            'POSTGRES_PASSWORD=buildkit-proof-not-used' \
            > data/.env

      - name: Enable rootless user namespaces
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [ "$(sysctl -n user.max_user_namespaces)" -eq 0 ]; then
            sudo sysctl -w user.max_user_namespaces=16384
          fi

      - name: Prove BuildKit isolation
        run: bash scripts/buildkit-isolation-e2e.sh

  ruby-toolchain:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: lrail
          POSTGRES_PASSWORD: lrail_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=lrail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: lrail
      POSTGRES_PASSWORD: lrail_test_password
      CONTROL_PLANE_TEST_DATABASE: lrail_control_plane_test
      RAILS_DUMP_SCHEMA: "true"
      RAILS_ENCRYPTION_KEY: lrail-ci-encryption-key-not-for-production
    defaults:
      run:
        working-directory: apps/control_plane
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true
          working-directory: apps/control_plane

      - name: Verify pinned versions
        run: |
          ruby_version="$(ruby -e 'print RUBY_VERSION')"
          rails_version="$(bundle exec rails --version)"
          rspec_version="$(bundle exec ruby -e 'require "rspec/rails/version"; print RSpec::Rails::Version::STRING')"

          printf 'Ruby %s\n' "$ruby_version"
          printf '%s\n' "$rails_version"
          printf 'RSpec Rails %s\n' "$rspec_version"

          test "$ruby_version" = "3.4.10"
          test "$rails_version" = "Rails 8.1.3"
          test "$rspec_version" = "8.0.4"

      - name: Verify migrations and schema
        run: |
          bin/rails db:drop db:create db:migrate
          bin/rails db:schema:dump
          git diff --exit-code -- db/schema.rb

      - name: Run control-plane CI
        run: bin/ci