name: Foundation

on:
  push:
    branches:
      - ayo
  pull_request:

permissions:
  contents: read

jobs:
  ruby-toolchain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control_plane
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true
          working-directory: apps/control_plane

      - name: Verify pinned versions
        run: |
          ruby_version="$(ruby -e 'print RUBY_VERSION')"
          rails_version="$(bundle exec rails --version)"
          rspec_version="$(bundle exec ruby -e 'require "rspec/rails/version"; print RSpec::Rails::Version::STRING')"

          printf 'Ruby %s\n' "$ruby_version"
          printf '%s\n' "$rails_version"
          printf 'RSpec Rails %s\n' "$rspec_version"

          test "$ruby_version" = "3.4.10"
          test "$rails_version" = "Rails 8.1.3"
          test "$rspec_version" = "8.0.4"