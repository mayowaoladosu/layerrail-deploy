services:
  control-plane:
    build:
      context: ..
      dockerfile: docker/Dockerfile.control-plane.dev
      args:
        APP_UID: ${SERVICE_UID:-1000}
        APP_GID: ${SERVICE_GID:-1000}
    entrypoint: /entrypoint.control-plane.dev.sh
    command: bundle exec rails server --binding 0.0.0.0 --port 3000
    restart: unless-stopped
    depends_on:
      - pgsql
    networks:
      - default
      - internal
    env_file:
      - ${DATA_DIR:-../data}/.env
    environment:
      BUNDLE_FROZEN: "true"
      BUNDLE_USER_HOME: /tmp/bundle-user
      HOME: /tmp/home
      LRAIL_CONTRACTS_DIR: /contracts
      RAILS_ENV: development
      RAILS_LOG_TO_STDOUT: "true"
      XDG_CACHE_HOME: /tmp/cache
      XDG_DATA_HOME: /tmp/data
      POSTGRES_HOST: pgsql
      POSTGRES_PORT: 5432
      LOCAL_PROVIDER_URL: http://local-provider:9000
      CONTROL_PLANE_DATABASE: ${CONTROL_PLANE_DATABASE:-lrail_control_plane_development}
      CONTROL_PLANE_TEST_DATABASE: ${CONTROL_PLANE_TEST_DATABASE:-lrail_control_plane_test}
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ${APP_DIR:-..}/apps/control_plane:/rails
      - ${APP_DIR:-..}/contracts:/contracts:ro
      - local-provider-auth:/run/lrail-provider-auth:ro
      - control-plane-log:/rails/log
      - control-plane-storage:/rails/storage
      - control-plane-tmp:/rails/tmp
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.control-plane.rule=Host(`control.localhost`)"
      - "traefik.http.routers.control-plane.entrypoints=web"
      - "traefik.http.routers.control-plane.priority=20"
      - "traefik.http.services.control-plane.loadbalancer.server.port=3000"
      - "traefik.docker.network=devpush_default"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  local-provider:
    build:
      context: ..
      dockerfile: docker/Dockerfile.local-provider
      args:
        APP_UID: ${SERVICE_UID:-1000}
        APP_GID: ${SERVICE_GID:-1000}
    restart: unless-stopped
    depends_on:
      - control-plane
      - local-docker-proxy
    networks:
      - internal
      - local-runtime
      - local-provider-docker
    environment:
      CONTROL_PLANE_URL: http://control-plane:3000
      CONTROL_PLANE_HTTP_HOST: control.localhost
      DOCKER_HOST: tcp://local-docker-proxy:2375
      DEPLOY_DOMAIN: ${DEPLOY_DOMAIN:-localhost}
      RUNTIME_NETWORK: devpush_local_runtime
      LOCAL_PROVIDER_ALLOWED_IMAGE_REFERENCE: lrail-local-sample:dev
      LOCAL_PROVIDER_STATE_DIR: /var/lib/lrail-provider
      LOCAL_PROVIDER_ROUTES_DIR: /var/lib/lrail-routes
      LOCAL_PROVIDER_SHARED_SECRET_FILE: /run/lrail-provider-auth/secret
    volumes:
      - local-provider-auth:/run/lrail-provider-auth
      - local-provider-state:/var/lib/lrail-provider
      - ${DATA_DIR:-../data}/traefik:/var/lib/lrail-routes
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  local-docker-proxy:
    image: tecnativa/docker-socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APP_DIR:-..}/docker/local-provider-proxy.cfg:/usr/local/etc/haproxy/haproxy.cfg.template:ro
    environment:
      DISABLE_IPV6: "1"
    networks:
      - local-provider-docker

  buildkit-volume-init:
    profiles: ["buildkit-poc"]
    image: moby/buildkit:v0.26.2-rootless@sha256:0ffa2fcf6b8757c47d569b3ef0f03f9d5eb3b9ff5ce68d858f994f89b749da0c
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        install -d -o 1000 -g 1000 -m 0700 /state /socket
        rm -f /socket/buildkitd.sock
        chown -R 1000:1000 /state /socket
    read_only: true
    volumes:
      - buildkit-state:/state
      - buildkit-socket:/socket

  buildkitd:
    profiles: ["buildkit-poc"]
    image: moby/buildkit:v0.26.2-rootless@sha256:0ffa2fcf6b8757c47d569b3ef0f03f9d5eb3b9ff5ce68d858f994f89b749da0c
    restart: unless-stopped
    depends_on:
      buildkit-volume-init:
        condition: service_completed_successfully
    command:
      - --addr
      - unix:///run/user/1000/buildkit/buildkitd.sock
      - --oci-worker-snapshotter=native
    networks:
      - buildkit-sandbox
    read_only: true
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 512
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=67108864,uid=1000,gid=1000
      - /home/user/.local/tmp:rw,nosuid,nodev,noexec,size=16777216,uid=1000,gid=1000
      - /run/user/1000:rw,nosuid,nodev,noexec,size=16777216,uid=1000,gid=1000
    volumes:
      - buildkit-state:/home/user/.local/share/buildkit
      - buildkit-socket:/run/user/1000/buildkit
    healthcheck:
      test: ["CMD", "/usr/bin/buildctl", "--addr", "unix:///run/user/1000/buildkit/buildkitd.sock", "debug", "workers"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  buildkit-client:
    profiles: ["buildkit-poc"]
    image: moby/buildkit:v0.26.2-rootless@sha256:0ffa2fcf6b8757c47d569b3ef0f03f9d5eb3b9ff5ce68d858f994f89b749da0c
    user: "1000:1000"
    depends_on:
      buildkitd:
        condition: service_healthy
    network_mode: none
    entrypoint:
      - /usr/bin/buildctl
      - --addr
      - unix:///run/user/1000/buildkit/buildkitd.sock
    command: ["debug", "workers"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16777216
    volumes:
      - buildkit-socket:/run/user/1000/buildkit:ro
      - ${DATA_DIR:-../data}/buildkit-proof:/proof

  buildkit-proof-fixture:
    profiles: ["buildkit-poc"]
    image: moby/buildkit:v0.26.2-rootless@sha256:0ffa2fcf6b8757c47d569b3ef0f03f9d5eb3b9ff5ce68d858f994f89b749da0c
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        rm -rf /proof/context /proof/output-network /proof/output-owner /proof/output-attacker
        install -d -m 0750 /proof/context/rootfs/bin /proof/context/rootfs/lib
        cp /fixture/Dockerfile.* /proof/context/
        cp /bin/busybox /proof/context/rootfs/bin/busybox
        cp /lib/ld-musl-x86_64.so.1 /proof/context/rootfs/lib/ld-musl-x86_64.so.1
        ln -s ld-musl-x86_64.so.1 /proof/context/rootfs/lib/libc.musl-x86_64.so.1
        chown -R 1000:1000 /proof
        chmod 0700 /proof
    read_only: true
    volumes:
      - ${APP_DIR:-..}/samples/buildkit-isolation:/fixture:ro
      - ${DATA_DIR:-../data}/buildkit-proof:/proof

  buildkit-control-plane-canary:
    profiles: ["buildkit-poc"]
    image: moby/buildkit:v0.26.2-rootless@sha256:0ffa2fcf6b8757c47d569b3ef0f03f9d5eb3b9ff5ce68d858f994f89b749da0c
    entrypoint: ["/bin/busybox", "nc", "-lk", "-p", "8080", "-e", "/bin/cat"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    healthcheck:
      test: ["CMD", "/bin/busybox", "nc", "-z", "-w", "1", "127.0.0.1", "8080"]
      interval: 2s
      timeout: 2s
      retries: 10

  local-provider-sample:
    profiles: ["samples"]
    image: lrail-local-sample:dev
    build:
      context: ../samples/local-provider-web
      dockerfile: Dockerfile
    networks:
      - local-runtime

  traefik:
    networks:
      - local-runtime

volumes:
  control-plane-log:
  control-plane-storage:
  control-plane-tmp:
  local-provider-auth:
  local-provider-state:
  buildkit-state:
  buildkit-socket:

networks:
  local-provider-docker:
    name: devpush_local_provider_docker
    internal: true
  local-runtime:
    name: devpush_local_runtime
    internal: true
  buildkit-sandbox:
    name: devpush_buildkit_sandbox
    internal: true