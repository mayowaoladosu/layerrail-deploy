openapi: 3.0.3
info:
  title: Lrail API
  version: 1.0.0
  description: >-
    Organization-scoped API for Lrail projects, services, deployments,
    environments, logs and domains. Resource identifiers are opaque.
servers:
  - url: /v1
security:
  - bearerAuth: []
tags:
  - name: Organizations
  - name: Projects
  - name: Services
  - name: Deployments
  - name: Environments
  - name: Domains

paths:
  /organizations:
    post:
      tags: [Organizations]
      summary: Create an organization
      operationId: createOrganization
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization created
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        default:
          $ref: "#/components/responses/Error"

  /organizations/{organization_id}/projects:
    get:
      tags: [Projects]
      summary: List projects in an organization
      operationId: listOrganizationProjects
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Project page
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCollection"
        default:
          $ref: "#/components/responses/Error"

  /projects:
    post:
      tags: [Projects]
      summary: Create a project
      operationId: createProject
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/services:
    post:
      tags: [Services]
      summary: Create a deployable service
      operationId: createProjectService
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceRequest"
      responses:
        "201":
          description: Service created
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        default:
          $ref: "#/components/responses/Error"

  /services/{service_id}/deployments:
    post:
      tags: [Deployments]
      summary: Create an immutable deployment
      operationId: createDeployment
      parameters:
        - $ref: "#/components/parameters/ServiceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeploymentRequest"
      responses:
        "202":
          description: Deployment accepted
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        default:
          $ref: "#/components/responses/Error"

  /deployments/{deployment_id}:
    get:
      tags: [Deployments]
      summary: Get a deployment
      operationId: getDeployment
      parameters:
        - $ref: "#/components/parameters/DeploymentId"
      responses:
        "200":
          description: Deployment
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        default:
          $ref: "#/components/responses/Error"

  /deployments/{deployment_id}/cancel:
    post:
      tags: [Deployments]
      summary: Cancel a non-terminal deployment
      operationId: cancelDeployment
      parameters:
        - $ref: "#/components/parameters/DeploymentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelDeploymentRequest"
      responses:
        "202":
          description: Cancellation accepted
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"

  /environments/{environment_id}/promotions:
    post:
      tags: [Environments]
      summary: Promote a ready revision
      operationId: promoteEnvironment
      parameters:
        - $ref: "#/components/parameters/EnvironmentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionSelectionRequest"
      responses:
        "202":
          description: Promotion accepted
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"

  /environments/{environment_id}/rollbacks:
    post:
      tags: [Environments]
      summary: Roll back to a ready revision
      operationId: rollbackEnvironment
      parameters:
        - $ref: "#/components/parameters/EnvironmentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionSelectionRequest"
      responses:
        "202":
          description: Rollback accepted
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"

  /deployments/{deployment_id}/logs:
    get:
      tags: [Deployments]
      summary: List deployment logs
      operationId: listDeploymentLogs
      parameters:
        - $ref: "#/components/parameters/DeploymentId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Log page
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogCollection"
        default:
          $ref: "#/components/responses/Error"

  /services/{service_id}/domains:
    post:
      tags: [Domains]
      summary: Attach a domain to a service environment
      operationId: createServiceDomain
      parameters:
        - $ref: "#/components/parameters/ServiceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDomainRequest"
      responses:
        "202":
          description: Domain attachment accepted
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        default:
          $ref: "#/components/responses/Error"

  /services/{service_id}/scale:
    post:
      tags: [Services]
      summary: Set the desired replica count
      operationId: scaleService
      parameters:
        - $ref: "#/components/parameters/ServiceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScaleServiceRequest"
      responses:
        "202":
          description: Scaling operation accepted
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  headers:
    CorrelationId:
      description: Stable identifier for tracing this request across components.
      schema:
        type: string
        format: uuid

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Stable caller-generated key for one logical mutation.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    OrganizationId:
      name: organization_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PublicId"
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PublicId"
    ServiceId:
      name: service_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PublicId"
    DeploymentId:
      name: deployment_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PublicId"
    EnvironmentId:
      name: environment_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PublicId"
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  responses:
    Error:
      description: Request failed
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    PublicId:
      type: string
      description: Opaque, non-sequential resource identifier.
      minLength: 8
      maxLength: 64
      pattern: "^[A-Za-z0-9][A-Za-z0-9_-]+$"

    Organization:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          $ref: "#/components/schemas/PublicId"
        name:
          type: string
          minLength: 1
          maxLength: 120
        created_at:
          type: string
          format: date-time

    Project:
      type: object
      required: [id, organization_id, name, slug, created_at]
      properties:
        id:
          $ref: "#/components/schemas/PublicId"
        organization_id:
          $ref: "#/components/schemas/PublicId"
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        created_at:
          type: string
          format: date-time

    Service:
      type: object
      required: [id, organization_id, project_id, name, workload_type, source, runtime_policy, created_at]
      properties:
        id:
          $ref: "#/components/schemas/PublicId"
        organization_id:
          $ref: "#/components/schemas/PublicId"
        project_id:
          $ref: "#/components/schemas/PublicId"
        name:
          type: string
          minLength: 1
          maxLength: 120
        workload_type:
          type: string
          enum: [static, web, private, worker, cron, job]
        source:
          $ref: "#/components/schemas/SourceSnapshot"
        runtime_policy:
          $ref: "#/components/schemas/RuntimePolicy"
        created_at:
          type: string
          format: date-time

    Environment:
      type: object
      required: [id, organization_id, project_id, name, slug, kind, lifecycle_state, created_at]
      properties:
        id:
          $ref: "#/components/schemas/PublicId"
        organization_id:
          $ref: "#/components/schemas/PublicId"
        project_id:
          $ref: "#/components/schemas/PublicId"
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        kind:
          type: string
          enum: [production, staging, custom]
        branch:
          type: string
          maxLength: 255
          nullable: true
        lifecycle_state:
          $ref: "#/components/schemas/ResourceLifecycleState"
        created_at:
          type: string
          format: date-time

    Deployment:
      type: object
      required: [id, organization_id, service_id, status, source, created_at]
      properties:
        id:
          $ref: "#/components/schemas/PublicId"
        organization_id:
          $ref: "#/components/schemas/PublicId"
        service_id:
          $ref: "#/components/schemas/PublicId"
        status:
          type: string
          enum:
            - created
            - queued
            - preparing
            - building
            - scanning
            - deploying
            - verifying
            - ready
            - promoted
            - superseded
            - canceling
            - canceled
            - failed
        source:
          $ref: "#/components/schemas/SourceSnapshot"
        preview_url:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Operation:
      type: object
      required: [id, organization_id, status, correlation_id, created_at]
      properties:
        id:
          $ref: "#/components/schemas/PublicId"
        organization_id:
          $ref: "#/components/schemas/PublicId"
        resource_id:
          $ref: "#/components/schemas/PublicId"
        status:
          type: string
          enum: [pending, running, succeeded, failed, canceled]
        correlation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    Domain:
      type: object
      required:
        - id
        - organization_id
        - service_id
        - environment_id
        - hostname
        - ownership_status
        - certificate_status
      properties:
        id:
          $ref: "#/components/schemas/PublicId"
        organization_id:
          $ref: "#/components/schemas/PublicId"
        service_id:
          $ref: "#/components/schemas/PublicId"
        environment_id:
          $ref: "#/components/schemas/PublicId"
        hostname:
          type: string
          format: hostname
        ownership_status:
          type: string
          enum: [pending, verifying, active, failed]
        certificate_status:
          type: string
          enum: [pending, issuing, active, failed]

    LogEntry:
      type: object
      required: [timestamp, stream, message]
      properties:
        timestamp:
          type: string
          format: date-time
        stream:
          type: string
          enum: [build, runtime, system]
        level:
          type: string
          enum: [debug, info, warning, error]
        message:
          type: string

    PageInfo:
      type: object
      required: [next_cursor]
      properties:
        next_cursor:
          type: string
          nullable: true

    ProjectCollection:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        page:
          $ref: "#/components/schemas/PageInfo"

    LogCollection:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LogEntry"
        page:
          $ref: "#/components/schemas/PageInfo"

    Error:
      type: object
      required: [code, message, correlation_id]
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        message:
          type: string
        correlation_id:
          type: string
          format: uuid
        details:
          type: object
          additionalProperties: true

    SourceSnapshot:
      type: object
      additionalProperties: false
      required: [type, reference]
      properties:
        type:
          type: string
          enum: [git, oci]
        reference:
          type: string
          minLength: 1
        repository_id:
          type: string
        root_directory:
          type: string

    RuntimePolicy:
      type: object
      additionalProperties: false
      properties:
        readiness_path:
          type: string
          pattern: "^/"
          maxLength: 2048
        liveness_path:
          type: string
          pattern: "^/"
          maxLength: 2048
        graceful_shutdown_seconds:
          type: integer
          minimum: 1
          maximum: 300

    ResourceLifecycleState:
      type: string
      enum:
        - active
        - deletion_requested
        - draining
        - deleting_resources
        - tombstoned
        - permanently_deleted

    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120

    CreateProjectRequest:
      type: object
      required: [organization_id, name]
      properties:
        organization_id:
          $ref: "#/components/schemas/PublicId"
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"

    CreateServiceRequest:
      type: object
      required: [name, workload_type, source]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        workload_type:
          type: string
          enum: [static, web, private, worker, cron, job]
        source:
          $ref: "#/components/schemas/SourceSnapshot"
        runtime_policy:
          $ref: "#/components/schemas/RuntimePolicy"

    CreateDeploymentRequest:
      type: object
      required: [source]
      properties:
        source:
          $ref: "#/components/schemas/SourceSnapshot"
        environment_id:
          $ref: "#/components/schemas/PublicId"

    CancelDeploymentRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500

    RevisionSelectionRequest:
      type: object
      required: [revision_id]
      properties:
        revision_id:
          $ref: "#/components/schemas/PublicId"

    CreateDomainRequest:
      type: object
      required: [environment_id, hostname]
      properties:
        environment_id:
          $ref: "#/components/schemas/PublicId"
        hostname:
          type: string
          format: hostname

    ScaleServiceRequest:
      type: object
      required: [replicas]
      properties:
        replicas:
          type: integer
          minimum: 0