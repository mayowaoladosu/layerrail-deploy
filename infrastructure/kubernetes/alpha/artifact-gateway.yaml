apiVersion: apps/v1
kind: Deployment
metadata:
  name: artifact-gateway
  namespace: lrail-system
  labels:
    app.kubernetes.io/name: artifact-gateway
    app.kubernetes.io/part-of: lrail-alpha
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: artifact-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: artifact-gateway
        app.kubernetes.io/part-of: lrail-alpha
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: artifact-gateway
          image: lrail-artifact-gateway:dev
          imagePullPolicy: Never
          env:
            - name: ARTIFACT_GATEWAY_S3_ENDPOINT
              value: http://minio.lrail-system.svc.cluster.local:9000
            - name: ARTIFACT_GATEWAY_S3_ACCESS_KEY_PATH
              value: /run/lrail-artifacts/access-key
            - name: ARTIFACT_GATEWAY_S3_SECRET_KEY_PATH
              value: /run/lrail-artifacts/secret-key
            - name: ARTIFACT_GATEWAY_ADMIN_SECRET_PATH
              value: /run/lrail-artifacts/admin-secret
            - name: ARTIFACT_GATEWAY_HTTP_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - name: credentials
              mountPath: /run/lrail-artifacts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: credentials
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: lrail-artifact-credentials
                  items:
                    - key: artifact-access-key
                      path: access-key
                    - key: artifact-secret-key
                      path: secret-key
              - secret:
                  name: lrail-artifact-gateway-admin
                  items:
                    - key: admin-secret
                      path: admin-secret
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: artifact-gateway
  namespace: lrail-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: artifact-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30502
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: artifact-gateway-access
  namespace: lrail-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: artifact-gateway
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: ["lrail-builds", "lrail-system"]
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - protocol: TCP
          port: 8080
