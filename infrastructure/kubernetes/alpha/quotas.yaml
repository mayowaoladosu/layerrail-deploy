apiVersion: v1
kind: ResourceQuota
metadata:
  name: alpha-build-budget
  namespace: lrail-builds
spec:
  hard:
    count/jobs.batch: "8"
    count/pods: "16"
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    requests.ephemeral-storage: 16Gi
    limits.ephemeral-storage: 32Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: alpha-build-defaults
  namespace: lrail-builds
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 250m
        memory: 512Mi
        ephemeral-storage: 1Gi
      default:
        cpu: "2"
        memory: 4Gi
        ephemeral-storage: 8Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: alpha-runtime-budget
  namespace: lrail-runtime
spec:
  hard:
    count/pods: "32"
    count/services: "32"
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: alpha-runtime-defaults
  namespace: lrail-runtime
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 500m
        memory: 256Mi
