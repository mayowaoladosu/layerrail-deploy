apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-config
  namespace: lrail-system
data:
  config.yml: |
    version: 0.1
    log:
      level: info
      formatter: json
      fields:
        service: alpha-registry
    storage:
      redirect:
        disable: true
      s3:
        region: us-east-1
        regionendpoint: http://minio.lrail-system.svc.cluster.local:9000
        bucket: lrail-registry
        rootdirectory: /registry
        secure: false
        v4auth: true
        forcepathstyle: true
        chunksize: 5242880
      delete:
        enabled: true
    auth:
      token:
        realm: http://registry-auth.lrail.local:30501/token
        service: lrail-alpha-registry
        issuer: lrail-alpha-registry-auth
        rootcertbundle: /certs/tls.crt
    http:
      addr: :5000
      headers:
        X-Content-Type-Options: [nosniff]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: artifact-policies
  namespace: lrail-system
data:
  registry.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:GetBucketLocation", "s3:ListBucket", "s3:ListBucketMultipartUploads"],
          "Resource": ["arn:aws:s3:::lrail-registry"]
        },
        {
          "Effect": "Allow",
          "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"],
          "Resource": ["arn:aws:s3:::lrail-registry/*"]
        }
      ]
    }
  artifacts.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:GetBucketLocation", "s3:ListBucket", "s3:ListBucketMultipartUploads"],
          "Resource": ["arn:aws:s3:::lrail-static", "arn:aws:s3:::lrail-evidence", "arn:aws:s3:::lrail-sources"]
        },
        {
          "Effect": "Allow",
          "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"],
          "Resource": ["arn:aws:s3:::lrail-static/*", "arn:aws:s3:::lrail-evidence/*", "arn:aws:s3:::lrail-sources/*"]
        }
      ]
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: lrail-system
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: lrail-system
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: lrail-alpha
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: lrail-alpha
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
          args: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: lrail-artifact-credentials
                  key: minio-root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lrail-artifact-credentials
                  key: minio-root-password
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: lrail-system
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
---
apiVersion: batch/v1
kind: Job
metadata:
  name: artifact-bucket-init
  namespace: lrail-system
  labels:
    app.kubernetes.io/name: artifact-bucket-init
    app.kubernetes.io/part-of: lrail-alpha
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: artifact-bucket-init
        app.kubernetes.io/part-of: lrail-alpha
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init
          image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mc alias set alpha http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              for bucket in lrail-registry lrail-static lrail-evidence lrail-sources; do
                mc mb --ignore-existing "alpha/$bucket"
              done
              mc admin policy create alpha lrail-registry /policies/registry.json || mc admin policy info alpha lrail-registry
              mc admin policy create alpha lrail-artifacts /policies/artifacts.json || mc admin policy info alpha lrail-artifacts
              mc admin user add alpha "$REGISTRY_ACCESS_KEY" "$REGISTRY_SECRET_KEY" || true
              mc admin user add alpha "$ARTIFACT_ACCESS_KEY" "$ARTIFACT_SECRET_KEY" || true
              mc admin policy attach alpha lrail-registry --user "$REGISTRY_ACCESS_KEY"
              mc admin policy attach alpha lrail-artifacts --user "$ARTIFACT_ACCESS_KEY"
          env:
            - name: HOME
              value: /tmp
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: lrail-artifact-credentials
                  key: minio-root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lrail-artifact-credentials
                  key: minio-root-password
            - name: REGISTRY_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lrail-artifact-credentials
                  key: registry-access-key
            - name: REGISTRY_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lrail-artifact-credentials
                  key: registry-secret-key
            - name: ARTIFACT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lrail-artifact-credentials
                  key: artifact-access-key
            - name: ARTIFACT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lrail-artifact-credentials
                  key: artifact-secret-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: policies
              mountPath: /policies
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: policies
          configMap:
            name: artifact-policies
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-auth
  namespace: lrail-system
  labels:
    app.kubernetes.io/name: registry-auth
    app.kubernetes.io/part-of: lrail-alpha
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: registry-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry-auth
        app.kubernetes.io/part-of: lrail-alpha
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry-auth
          image: lrail-registry-auth:dev
          imagePullPolicy: Never
          env:
            - name: REGISTRY_AUTH_STATE_PATH
              value: /var/lib/lrail-registry-auth/registry-auth.sqlite3
            - name: REGISTRY_AUTH_SIGNING_KEY_PATH
              value: /run/lrail-registry-auth/tls.key
            - name: REGISTRY_AUTH_ADMIN_SECRET_PATH
              value: /run/lrail-registry-auth/admin-secret
            - name: REGISTRY_AUTH_ISSUER
              value: lrail-alpha-registry-auth
            - name: REGISTRY_AUTH_SERVICE
              value: lrail-alpha-registry
            - name: REGISTRY_AUTH_TOKEN_TTL_SECONDS
              value: "300"
            - name: REGISTRY_AUTH_HTTP_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - name: state
              mountPath: /var/lib/lrail-registry-auth
            - name: tls
              mountPath: /run/lrail-registry-auth/tls.key
              subPath: tls.key
              readOnly: true
            - name: admin-secret
              mountPath: /run/lrail-registry-auth/admin-secret
              subPath: admin-secret
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: registry-auth-state
        - name: tls
          secret:
            secretName: lrail-registry-auth-tls
            defaultMode: 0440
        - name: admin-secret
          secret:
            secretName: lrail-registry-auth-admin
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-auth-state
  namespace: lrail-system
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: registry-auth
  namespace: lrail-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: registry-auth
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30501
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: lrail-system
  labels:
    app.kubernetes.io/name: registry
    app.kubernetes.io/part-of: lrail-alpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
        app.kubernetes.io/part-of: lrail-alpha
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          image: registry@sha256:6c5666b861f3505b116bb9aa9b25175e71210414bd010d92035ff64018f9457e
          args: ["/etc/distribution/config.yml"]
          env:
            - name: OTEL_TRACES_EXPORTER
              value: none
            - name: REGISTRY_AUTH_TOKEN_REALM
              valueFrom:
                configMapKeyRef:
                  name: alpha-cell-config
                  key: registry-auth-realm
            - name: REGISTRY_STORAGE_S3_ACCESSKEY
              valueFrom:
                secretKeyRef:
                  name: lrail-artifact-credentials
                  key: registry-access-key
            - name: REGISTRY_STORAGE_S3_SECRETKEY
              valueFrom:
                secretKeyRef:
                  name: lrail-artifact-credentials
                  key: registry-secret-key
            - name: REGISTRY_HTTP_SECRET
              valueFrom:
                secretKeyRef:
                  name: lrail-registry-http
                  key: http-secret
          ports:
            - name: registry
              containerPort: 5000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: registry
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
          livenessProbe:
            tcpSocket:
              port: registry
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - name: config
              mountPath: /etc/distribution
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/lib/registry
            - name: auth-cert
              mountPath: /certs/tls.crt
              subPath: tls.crt
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: registry-config
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: cache
          emptyDir:
            sizeLimit: 256Mi
        - name: auth-cert
          secret:
            secretName: lrail-registry-auth-tls
            items:
              - key: tls.crt
                path: tls.crt
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: lrail-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: registry
  ports:
    - name: registry
      port: 5000
      targetPort: registry
      nodePort: 30500
