      - key: app.kubernetes.io/name
        operator: In
        values: ["registry", "artifact-bucket-init", "artifact-gateway"]
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: minio
      ports:
        - protocol: TCP
          port: 9000
