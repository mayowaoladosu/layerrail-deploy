apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-artifact-access
  namespace: lrail-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minio
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["registry", "artifact-bucket-init", "artifact-gateway"]
      ports:
        - protocol: TCP
          port: 9000
    - from:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - protocol: TCP
          port: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-client-egress
